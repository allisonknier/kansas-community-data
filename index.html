<style>
:root{
  --sage:#E7DFCC;
  --eucalyptus:#A9B59A;
  --olive:#6F8A63;
  --forest:#45623E;
  --cream:#F3F1E6;
  --sunflower:#D4B15C;
  --charcoal:#333333;
  --white:#FFFFFF;
  --housing-color:#45623E;
  --transport-color:#6F8A63;
  --alice-line:#D4B15C;
  --distress-bar:#A9B59A;
  --radius:10px;
  --shadow: 0 1px 3px rgba(69,98,62,0.08), 0 1px 2px rgba(69,98,62,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter', sans-serif;
  background:var(--cream);
  color:var(--charcoal);
  line-height:1.5;
}
h1,h2,h3,h4{
  font-family:'Merriweather', serif;
  color:var(--forest);
  margin:0 0 .4em 0;
  font-weight:600;
}
a{color:var(--forest);}
button, select{font-family:inherit;}

/* ===== Layout ===== */
#app{display:flex; min-height:100vh;}

#sidebar{
  width:320px;
  min-width:320px;
  background:var(--forest);
  color:var(--sage);
  padding:24px 20px 20px 20px;
  display:flex;
  flex-direction:column;
  gap:18px;
  position:sticky;
  top:0;
  align-self:flex-start;
  height:100vh;
  overflow-y:auto;
}
#sidebar .brand{display:flex; align-items:center; gap:12px; margin-bottom:4px;}
#sidebar .brand-icon-img{width:42px; height:42px; flex-shrink:0; display:block;}
#sidebar .brand-sub{font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--cream); line-height:1.3;}

.sb-label{font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; color:var(--sage); margin-bottom:6px; display:block;}
.sb-select-wrap{position:relative; margin-bottom:14px;}
.sb-select{
  width:100%;
  padding:10px 34px 10px 12px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.06);
  color:var(--cream);
  font-size:.92rem;
  appearance:none;
  cursor:pointer;
}
.sb-select:focus{outline:2px solid var(--sunflower); outline-offset:1px;}
.sb-select-wrap::after{
  content:"▾";
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  color:var(--sage); pointer-events:none; font-size:.8rem;
}
.sb-select option{color:var(--charcoal);}

#here-box{
  background:rgba(255,255,255,0.08);
  border-left:3px solid var(--sunflower);
  border-radius:6px;
  padding:10px 12px;
  font-size:.85rem;
  margin-bottom:6px;
}
#here-box .here-label{font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--sage); display:block; margin-bottom:3px;}
#here-box .here-value{color:var(--cream); font-weight:600; font-family:'Merriweather',serif; font-size:1rem;}

#sidebar hr{border:none; border-top:1px solid rgba(255,255,255,0.14); margin:2px 0;}

.sb-nav{display:flex; flex-direction:column; gap:4px;}
.sb-nav-btn{
  display:flex; align-items:center; gap:10px;
  background:none; border:none; text-align:left;
  color:var(--sage); padding:9px 10px; border-radius:7px;
  font-size:.92rem; cursor:pointer; width:100%;
  text-decoration:none; box-sizing:border-box;
}
.sb-nav-btn:hover{background:rgba(255,255,255,0.08);}
.sb-nav-btn.active{background:var(--olive); color:var(--cream); font-weight:600;}
.sb-nav-btn .dot{width:7px; height:7px; border-radius:50%; background:var(--sunflower); flex-shrink:0; display:none;}
.sb-nav-btn.has-badge .dot{display:inline-block;}

#sidebar .sb-footer{margin-top:auto; font-size:.72rem; color:var(--sage); padding-top:10px;}
.page-footer-note{
  margin-top:36px; padding:16px 20px; background:var(--forest); color:var(--cream);
  border-radius:var(--radius); font-size:.92rem; text-align:center;
}
.page-footer-note a{color:var(--sunflower); font-weight:600; text-decoration:underline; cursor:pointer;}

/* ===== Main content ===== */
#main{flex:1; padding:36px 44px 80px 44px; max-width:1100px;}
.eyebrow{font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--olive); font-weight:700; margin-bottom:6px;}
.page-title{font-size:2rem; margin-bottom:4px;}
.page-sub{color:#5b5b53; margin-bottom:22px; font-size:1rem; max-width:640px;}

/* hero panel (landing) */
.hero-panel{
  text-align:center; padding:28px 20px 32px 20px; margin-bottom:30px;
  background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow);
}
.hero-logo-img{width:100%; max-width:420px; height:auto; display:block; margin:0 auto;}
.hero-pointer{font-size:.98rem; color:var(--forest); font-weight:600; margin:16px 0 0 0;}

.meth-logo-img{width:100%; max-width:280px; height:auto; display:block; margin-bottom:18px;}

/* explainer boxes */
.explainer-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:26px;}
.explainer{
  background:var(--sage);
  border-radius:var(--radius);
  padding:14px 16px;
  flex:1 1 300px;
  font-size:.88rem;
  color:var(--charcoal);
}
.explainer strong{color:var(--forest); font-family:'Merriweather',serif; font-size:.95rem; display:block; margin-bottom:3px;}

/* badge */
.badge-link{
  display:inline-flex; align-items:center; gap:7px;
  background:var(--sunflower); color:var(--charcoal);
  border:none; border-radius:20px; padding:8px 16px;
  font-weight:600; font-size:.86rem; cursor:pointer;
  margin-bottom:22px;
  box-shadow:var(--shadow);
}
.badge-link:hover{filter:brightness(0.96);}

/* cards */
.card-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:30px;}
.stat-card{
  background:var(--white); border-radius:var(--radius); padding:16px 18px;
  box-shadow:var(--shadow); border-top:3px solid var(--forest);
}
.stat-card .stat-label{font-size:.78rem; color:#6b6b60; text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
.stat-card .stat-value{font-family:'Merriweather',serif; font-size:1.7rem; color:var(--forest); font-weight:700; line-height:1.1;}
.stat-card .stat-note{font-size:.78rem; color:#7a7a6e; margin-top:5px;}

section.block{margin-bottom:34px;}
section.block h3{font-size:1.15rem; margin-bottom:10px;}
.block-note{font-size:.85rem; color:#6b6b60; margin-bottom:12px; max-width:640px;}

/* per-100 bars */
.per100{margin-bottom:16px;}
.per100 .p100-head{display:flex; justify-content:space-between; font-size:.88rem; margin-bottom:5px;}
.per100 .p100-head b{color:var(--forest);}
.p100-track{background:var(--sage); border-radius:6px; height:22px; overflow:hidden; position:relative;}
.p100-fill{height:100%; border-radius:6px 0 0 6px; display:flex; align-items:center; color:white; font-size:.75rem; font-weight:600; padding-left:8px; white-space:nowrap;}
.p100-fill.over{background:#b3452f !important;}

/* legend */
.legend{display:flex; gap:16px; font-size:.82rem; margin-bottom:10px; flex-wrap:wrap;}
.legend span{display:inline-flex; align-items:center; gap:6px;}
.legend i{width:11px; height:11px; border-radius:3px; display:inline-block;}

/* combo chart */
.chart-wrap{background:var(--white); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow);}

/* region county table */
table.data-table{width:100%; border-collapse:collapse; font-size:.88rem; background:var(--white); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);}
table.data-table th{background:var(--forest); color:var(--cream); text-align:left; padding:10px 12px; font-weight:600; font-size:.78rem; text-transform:uppercase; letter-spacing:.03em;}
table.data-table td{padding:9px 12px; border-bottom:1px solid var(--sage);}
table.data-table tr:last-child td{border-bottom:none;}
table.data-table tr.clickable{cursor:pointer;}
table.data-table tr.clickable:hover{background:var(--cream);}

/* findings list */
.finding-card{
  background:var(--white); border-radius:var(--radius); padding:16px 18px 16px 18px;
  box-shadow:var(--shadow); margin-bottom:14px; border-left:4px solid var(--sunflower);
}
.finding-card .f-scope{font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:var(--olive); font-weight:700; margin-bottom:5px;}
.finding-card p{margin:0; font-size:.94rem;}

.rural-note{
  background:var(--sage); border-radius:var(--radius); padding:16px 18px; margin-bottom:16px; font-size:.92rem;
}

.icon{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.8;}

.back-link{background:none; border:none; color:var(--olive); font-size:.85rem; cursor:pointer; padding:0; margin-bottom:14px; display:inline-flex; align-items:center; gap:5px;}
.back-link:hover{text-decoration:underline;}

.meth-section{margin-bottom:24px;}
.meth-section h4{font-size:1rem; margin-bottom:8px;}
.meth-section ul{margin:0; padding-left:20px; font-size:.9rem;}
.meth-section li{margin-bottom:4px;}

.contact-box{background:var(--white); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); max-width:420px;}

@media (max-width: 860px){
  #app{flex-direction:column;}
  #sidebar{width:100%; height:auto; position:relative; min-width:0;}
  #main{padding:24px 18px 60px 18px;}
}
</style>
</head>

// ===== Shared explainer boxes =====
function explainerBoxes(){
  return `
  <div class="explainer-row">
    <div class="explainer">
      <strong>What's a Continuum of Care (CoC) region?</strong>
      A CoC region is a group of counties that plan and report on homeless services together for HUD, the federal housing agency. Kansas has four: three are single big counties (Wichita/Sedgwick, Topeka/Shawnee, Overland Park/Johnson), and the fourth — Balance of State — covers all 101 remaining, mostly rural, counties as one region.
    </div>
    <div class="explainer">
      <strong>What's an ALICE rate?</strong>
      ALICE stands for Asset Limited, Income Constrained, Employed — households working but still not earning enough to cover basics like housing, food, and child care. The ALICE rate is the share of households in poverty <em>plus</em> ALICE households combined, so it captures hardship poverty numbers alone tend to miss.
    </div>
    <div class="explainer">
      <strong>What does the PIT count actually capture?</strong>
      The Point-in-Time (PIT) count is a single-night count of people found in shelters, transitional housing, or unsheltered locations. It does <em>not</em> include people who are "doubled up" — staying temporarily with family or friends because they have nowhere else to go, one of the most common and hardest-to-see forms of rural homelessness. A county showing 0 doesn't necessarily mean no one there is experiencing homelessness — it can also mean no outreach or shelter organization was counting in that area that night. Read a zero as "not counted," not "not present."
    </div>
  </div>`;
}

function findingsBadge(count, targetType, targetValue, label){
  if(count<=0) return '';
  const args = targetValue ? `'${targetType}','${targetValue}'` : `'${targetType}'`;
  return `<button class="badge-link" onclick="setView(${args})">${svgIcon('findings')} ${label||( count+' key finding'+(count>1?'s':'')+' for this area')}</button>`;
}

// ===== Per-$100 bars =====
function per100Block(housingPct, transportPct){
  const hOver = housingPct >= 30;
  return `
  <div class="legend">
    <span><i style="background:var(--housing-color)"></i>Housing</span>
    <span><i style="background:var(--transport-color)"></i>Transportation</span>
  </div>
  <div class="per100">
    <div class="p100-head"><span>Housing</span><b>$${housingPct.toFixed(0)} of every $100 earned</b></div>
    <div class="p100-track"><div class="p100-fill" style="width:${Math.min(housingPct,100)}%; background:var(--housing-color);">${housingPct.toFixed(0)}%</div></div>
  </div>
  <div class="per100">
    <div class="p100-head"><span>Transportation</span><b>$${transportPct.toFixed(0)} of every $100 earned</b></div>
    <div class="p100-track"><div class="p100-fill" style="width:${Math.min(transportPct,100)}%; background:var(--transport-color);">${transportPct.toFixed(0)}%</div></div>
  </div>
  <p class="block-note">Together, that's $${(housingPct+transportPct).toFixed(0)} of every $100 a typical household earns here going just to keeping a roof overhead and getting to work — before food, child care, or anything else.</p>`;
}

// ===== Minimum wage / rent affordability callout =====
function minWageCallout(medianRent){
  if(medianRent==null){
    return `
    <div class="rural-note" style="border-left:4px solid var(--forest);">
      <strong style="color:var(--forest); font-family:'Merriweather',serif; display:block; margin-bottom:4px;">What minimum wage covers here</strong>
      The Census Bureau suppresses median rent for this county because the sample size is too small to report reliably, so we can't show a dollar comparison here. This isn't unique to this page — it's a real gap in the underlying public data.
    </div>`;
  }
  const hourly = STATE['Minimum Wage ($/hr, flat)'];
  const monthlyIncome = hourly*40*52/12;
  const affordable = monthlyIncome*0.3;
  const gap = Math.round(medianRent - affordable);
  return `
  <div class="rural-note" style="border-left:4px solid var(--forest);">
    <strong style="color:var(--forest); font-family:'Merriweather',serif; display:block; margin-bottom:4px;">What minimum wage covers here</strong>
    A full-time worker earning Kansas's minimum wage (${fmtMoney(hourly)}/hour) takes home about ${fmtMoney(monthlyIncome)} a month. Housing is considered "affordable" when it costs no more than 30% of income — about ${fmtMoney(affordable)} a month here. A typical 2-bedroom home costs ${fmtMoney(medianRent)}, which is ${fmtMoney(gap)} more than that per month.
  </div>`;
}

// ===== SSDI / SSI vs. housing costs =====
function disabilityIncomeBlock(obj){
  const ssiFlat = STATE['SSI Monthly Payment (flat federal figure)'];
  const hasRent = obj.median_rent_2br!=null;
  const ssdiGap = (hasRent && obj.avg_monthly_ssdi!=null) ? Math.round(obj.median_rent_2br - obj.avg_monthly_ssdi) : null;
  const ssdiNote = !hasRent
    ? 'rent not available for this county (suppressed by Census)'
    : (ssdiGap>0 ? `$${ssdiGap} short of ${fmtMoney(obj.median_rent_2br)} rent for a 2BR here` : `covers the ${fmtMoney(obj.median_rent_2br)} rent for a 2BR here`);
  return `
  <div class="card-grid">
    <div class="stat-card"><div class="stat-label">Disabled Workers Receiving SSDI</div><div class="stat-value">${fmtNum(obj.ssdi_count)}</div></div>
    <div class="stat-card"><div class="stat-label">Average Monthly SSDI Payment</div><div class="stat-value">${fmtMoney(obj.avg_monthly_ssdi)}</div><div class="stat-note">${ssdiNote}</div></div>
    <div class="stat-card"><div class="stat-label">SSI Monthly Payment</div><div class="stat-value">${fmtMoney(ssiFlat)}</div><div class="stat-note">flat federal amount, same statewide</div></div>
  </div>
  <p class="block-note">SSI is a flat federal benefit — everyone who relies on it gets the same ${fmtMoney(ssiFlat)} a month, no matter where in Kansas they live. Local rent, shown above and elsewhere on this page, varies widely across the state, so how far that check actually goes depends heavily on location.</p>`;
}


// ===== Combo chart: mental distress bars + ALICE line, by region =====
// ===== Broadband vs ALICE dual-line chart =====
function broadbandChart(){
  const w = 640, h = 300, pad = {l:46,r:46,t:20,b:50};
  const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;
  const n = REAL_COC.length;
  const maxNet = 20, maxAlice = 50;

  let netLine = '', aliceLine = '', labels = '', dots = '';
  let netPts = [], alicePts = [];
  REAL_COC.forEach((r,i)=>{
    const cx = pad.l + (i+0.5)*(plotW/n);
    const ny = pad.t + plotH - (r.no_slow_internet_2023/maxNet)*plotH;
    netPts.push([cx,ny]);
    const ay = pad.t + plotH - (r.alice_rate/maxAlice)*plotH;
    alicePts.push([cx,ay]);
    labels += `<text x="${cx}" y="${h-14}" text-anchor="middle" font-size="11" fill="#5b5b53">${coName(r.coc).split(' / ')[0].split(' ')[0]}</text>`;
  });
  for(let i=0;i<netPts.length-1;i++){
    netLine += `<line x1="${netPts[i][0]}" y1="${netPts[i][1]}" x2="${netPts[i+1][0]}" y2="${netPts[i+1][1]}" stroke="var(--olive)" stroke-width="3"/>`;
    aliceLine += `<line x1="${alicePts[i][0]}" y1="${alicePts[i][1]}" x2="${alicePts[i+1][0]}" y2="${alicePts[i+1][1]}" stroke="var(--alice-line)" stroke-width="3"/>`;
  }
  netPts.forEach((p,i)=>{
    dots += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--olive)" stroke="#fff" stroke-width="1.5"/>`;
    dots += `<text x="${p[0]}" y="${p[1]-11}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--olive)">${REAL_COC[i].no_slow_internet_2023}%</text>`;
  });
  alicePts.forEach((p,i)=>{
    dots += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--alice-line)" stroke="#fff" stroke-width="1.5"/>`;
    dots += `<text x="${p[0]}" y="${p[1]-11}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--forest)">${REAL_COC[i].alice_rate}%</text>`;
  });

  return `
  <div class="legend">
    <span><i style="background:var(--olive)"></i>Households with no or slow internet (%)</span>
    <span><i style="background:var(--alice-line)"></i>ALICE rate (%)</span>
  </div>
  <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">
    <line x1="${pad.l}" y1="${pad.t+plotH}" x2="${w-pad.r}" y2="${pad.t+plotH}" stroke="var(--sage)" stroke-width="2"/>
    ${netLine}
    ${aliceLine}
    ${dots}
    ${labels}
  </svg>
  <p class="block-note">Regions with more households lacking reliable internet also tend to have higher ALICE rates — a real pattern, though not as strong as the link to mental distress.</p>
  `;
}

// ===== Vacancy: actually-for-rent vs. total vacant, side by side =====
function vacancyBlock(obj){
  const total = obj.total_vacancy_rate;
  const forRent = obj.livable_vacancy_rate;
  const otherVacant = Math.max(total - forRent, 0);
  const forRentShareOfVacant = obj.pct_vacant_for_rent;
  const forRentW = (forRent/total)*100;
  const otherW = 100 - forRentW;
  return `
  <div class="legend">
    <span><i style="background:var(--forest)"></i>Vacant and actually for rent</span>
    <span><i style="background:var(--sage); border:1px solid var(--eucalyptus);"></i>Vacant for other reasons</span>
  </div>
  <div class="p100-track" style="height:32px; display:flex;">
    <div style="width:${forRentW}%; background:var(--forest); display:flex; align-items:center; justify-content:center; color:white; font-size:.78rem; font-weight:600; border-radius:6px 0 0 6px;">${forRent}%</div>
    <div style="width:${otherW}%; background:var(--sage); display:flex; align-items:center; justify-content:center; color:var(--forest); font-size:.78rem; font-weight:600; border-radius:0 6px 6px 0;">${otherWidthLabel(otherVacant)}</div>
  </div>
  <p class="block-note">Of all housing units here, ${total}% sit vacant. But only ${forRent} percentage points of that — ${forRentShareOfVacant}% of the vacant units themselves — are actually listed for rent. The rest sit empty for other reasons: disrepair, inheritance disputes, seasonal use, and similar.</p>
  `;
}
function otherWidthLabel(v){ return v>=1 ? v.toFixed(1)+'%' : ''; }

// ===== Student homelessness (NCHE, statewide only) =====
function studentHomelessnessBlock(){
  const years = STATE['NCHE_years'];
  const enrolled = STATE['NCHE_enrolled'];
  const pctStudents = STATE['NCHE_pct_of_students'];
  const chronicAbsent = STATE['NCHE_chronic_absent_pct'];
  const rows = years.map((y,i)=>`<tr><td>${y}</td><td>${fmtNum(enrolled[i])}</td><td>${pctStudents[i]}% of all KS students</td><td>${chronicAbsent[i]}%</td></tr>`).join('');
  const latestGap = Math.round((chronicAbsent[chronicAbsent.length-1] - STATE['NCHE_general_chronic_absent_2022'])*10)/10;

  return `
  <p class="block-note">Kansas doesn't publish this data below the state level, so this section is statewide only, same as the domestic violence figures above.</p>
  <table class="data-table">
    <tr><th>School year</th><th>Students experiencing homelessness (enrolled)</th><th>Share of all KS students</th><th>Chronically absent</th></tr>
    ${rows}
  </table>
  <div class="rural-note" style="margin-top:14px; border-left:4px solid var(--sunflower);">
    <strong style="color:var(--forest); font-family:'Merriweather',serif; display:block; margin-bottom:4px;">A steep climb in missed school</strong>
    By SY 2021-22, nearly half of Kansas students experiencing homelessness (${chronicAbsent[chronicAbsent.length-1]}%) were chronically absent — missing 10% or more of the school year. That's about ${latestGap} percentage points higher than the chronic absenteeism rate for Kansas public-school students generally (${STATE['NCHE_general_chronic_absent_2022']}%), and the gap between the two groups widened every year in this data.
  </div>
  `;
}

function comboChart(){
  const w = 640, h = 300, pad = {l:46,r:46,t:20,b:50};
  const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;
  const n = REAL_COC.length;
  const maxDistress = 25, maxAlice = 50;

  let distressLine = '', aliceLine = '', labels = '', dots = '';
  let distressPts = [], alicePts = [];
  REAL_COC.forEach((r,i)=>{
    const cx = pad.l + (i+0.5)*(plotW/n);
    const dy = pad.t + plotH - (r.mental_distress_2023/maxDistress)*plotH;
    distressPts.push([cx,dy]);
    const ay = pad.t + plotH - (r.alice_rate/maxAlice)*plotH;
    alicePts.push([cx,ay]);
    labels += `<text x="${cx}" y="${h-14}" text-anchor="middle" font-size="11" fill="#5b5b53">${coName(r.coc).split(' / ')[0].split(' ')[0]}</text>`;
  });
  for(let i=0;i<distressPts.length-1;i++){
    distressLine += `<line x1="${distressPts[i][0]}" y1="${distressPts[i][1]}" x2="${distressPts[i+1][0]}" y2="${distressPts[i+1][1]}" stroke="var(--distress-bar)" stroke-width="3"/>`;
    aliceLine += `<line x1="${alicePts[i][0]}" y1="${alicePts[i][1]}" x2="${alicePts[i+1][0]}" y2="${alicePts[i+1][1]}" stroke="var(--alice-line)" stroke-width="3"/>`;
  }
  distressPts.forEach((p,i)=>{
    dots += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--distress-bar)" stroke="#fff" stroke-width="1.5"/>`;
    dots += `<text x="${p[0]}" y="${p[1]-11}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--olive)">${REAL_COC[i].mental_distress_2023}%</text>`;
  });
  alicePts.forEach((p,i)=>{
    dots += `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--alice-line)" stroke="#fff" stroke-width="1.5"/>`;
    dots += `<text x="${p[0]}" y="${p[1]-11}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--forest)">${REAL_COC[i].alice_rate}%</text>`;
  });

  return `
  <div class="legend">
    <span><i style="background:var(--distress-bar)"></i>Adults with frequent mental distress (%)</span>
    <span><i style="background:var(--alice-line)"></i>ALICE rate (%)</span>
  </div>
  <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">
    <line x1="${pad.l}" y1="${pad.t+plotH}" x2="${w-pad.r}" y2="${pad.t+plotH}" stroke="var(--sage)" stroke-width="2"/>
    ${distressLine}
    ${aliceLine}
    ${dots}
    ${labels}
  </svg>
  <p class="block-note">Regions with higher rates of frequent mental distress also tend to have higher ALICE rates — one of the clearest patterns in the data, stronger than the link to broadband access, and far stronger than any link to local business activity.</p>
  `;
}

function renderMethodology(){
  return `

    <h1 class="page-title">Sources &amp; how this was built</h1>

    <div class="meth-section">
      <h4>Data sources</h4>
      <ul>
        <li>United For ALICE — Kansas data (ALICE households, cost of living thresholds)</li>
        <li>HUD Self-Sufficiency and Point-in-Time (PIT) homeless counts, 2016–2024</li>
        <li>HUD Housing Inventory Count (HIC)</li>
        <li>NCHE — student homelessness report (Kansas, SY 2019-20 to 2021-22)</li>
        <li>NNEDV — national and Kansas domestic violence service counts</li>
        <li>KCSDV member provider list; KSHC emergency shelters; Kansas Hospital Association</li>
        <li>K-State "All Things Kansas" platform (built with CARES / University of Missouri data support)</li>
        <li>U.S. Census Bureau American Community Survey (ACS); BLS OEWS and LAUS</li>
        <li>UNC Cecil G. Sheps Center for Health Services Research — Rural Hospital Closures and Rural Emergency Hospitals databases (built from CMS data); Kansas Department for Aging and Disability Services (KDADS) licensing records; CMS/CareListings — hospital and care-facility service changes</li>
        <li>Center for Healthcare Quality &amp; Payment Reform (CHQPR) — statewide rural hospital risk analysis, 2026</li>

    <div class="meth-section">
      <h4>How regional numbers are calculated</h4>
      <ul>
        <li>Where we have both a count and a total (like households below the ALICE threshold out of total households), regional numbers are added up from the county-level counts — not averaged.</li>
        <li>Where a metric is only available as a ratio (like a percentage with no underlying count), we use a weighted average — weighted by household count or housing unit count, never a simple average across counties, so large and small counties are represented fairly.</li>
      </ul>
    </div>

    <div class="meth-section">
      <h4>Known limitations</h4>
      <ul>
        <li><strong>Wyandotte County</strong> is tracked but kept separate from Balance of State and other CoC rollups, and from year-over-year trend comparisons, because HUD has coded it inconsistently across years — combining it in would make totals unreliable.</li>
        <li><strong>Drive-time figures</strong> to services (DCF, SSA, United Way offices) have a known data gap: incomplete office rosters and some computational routing errors. We're in the process of a fuller rerun; a few confirmed errors have already been corrected, and two counties remain flagged as uncertain in the meantime.</li>
        <li><strong>Some county-level rent data is suppressed</strong> by the source for privacy reasons in very small counties (for example, Hamilton and Lane), so those figures may show as unavailable.</li>
        <li><strong>County-level figures can hide within-county variation.</strong> In large rural counties, towns outside the county seat often face longer drives to services than the county-level number suggests.</li>
        <li><strong>Top employer data is not available for Douglas, Johnson, Shawnee, Sedgwick, or Wyandotte counties</strong> — this research pass covered rural (Balance of State) counties only.</li>
        <li><strong>Hospital service-change notes reflect the hospital itself, not the whole town.</strong> A closure means that specific facility stopped providing that service — it doesn't rule out a separate clinic or health center operating in the same community afterward, which we have not independently checked for each site.</li>
        <li><strong>Schedule/shift-work notes are national averages</strong>, not a survey of any specific Kansas employer, and are shown only for industries where solid national data exists (health care, manufacturing, retail, and agriculture).</li>
      </ul>
    </div>

    <div class="meth-section">
      <h4>Data currency</h4>
      <p style="font-size:.9rem;">Most figures reflect the most recent published ACS 5-year estimates and the 2025 HUD Point-in-Time count. Mental distress figures are 2018–2023 CDC BRFSS/PLACES data. Where a source publishes only a single statewide figure (like the NCHE student homelessness report or the NNEDV one-day DV survey), that figure is shown as-is rather than estimated down to the county level.</p>
    </div>
  `;
}

function renderContact(){
  return `
    <button class="back-link" onclick="setView('statewide')">← Back to statewide</button>
    <div class="eyebrow">Contact</div>
    <h1 class="page-title">Get in touch</h1>
    <div class="contact-box">
      <p style="margin-top:0;">Questions, corrections, or want to talk about this data?</p>
      <p style="margin-bottom:0;"><strong>Allison Knier</strong><br><a href="mailto:allisonknier@gmail.com">allisonknier@gmail.com</a></p>
    </div>
  `;
}

// ===== Router =====
function render(){
  renderSidebar();
  const main = document.getElementById('main');
  if(view.type==='statewide') main.innerHTML = renderStatewide();
  else if(view.type==='region') main.innerHTML = renderRegion(view.value);
  else if(view.type==='county') main.innerHTML = renderCounty(view.value);
  else if(view.type==='keyfindings') main.innerHTML = renderKeyFindings();
  else if(view.type==='rural') main.innerHTML = renderRural();
  else if(view.type==='methodology') main.innerHTML = renderMethodology();
  else if(view.type==='contact') main.innerHTML = renderContact();

  if(view.type!=='methodology'){
    main.innerHTML += `<div class="page-footer-note">📊 Want to know where this data comes from? <a onclick="event.preventDefault(); setView('methodology')">Check Sources &amp; how this was built</a>.</div>`;
  }
}

render();

</script>
